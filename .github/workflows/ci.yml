name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24 is the major the app runs. package.json pins engines.node
      # to 24.x, so the Heroku build picks a 24.x release, and yarn's
      # install refuses any other major. CI runs the same major.
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install
        run: corepack yarn install --frozen-lockfile

      - name: Typecheck
        run: corepack yarn typecheck

      - name: Lint
        run: corepack yarn lint

      - name: Build
        run: corepack yarn build

      - name: Test
        run: corepack yarn test

      - name: Bench harness typecheck
        run: corepack yarn bench:check
